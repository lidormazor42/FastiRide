name: CI — Lint, Test, Deploy to Staging

# GitHub Flow: feature branches → PR → main. Every merge to main that passes
# lint+tests deploys to staging automatically. Production only updates when a
# version tag is pushed (see promote-to-production.yaml) — see PROJECT_BOOK.md.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "helm/**"
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1

jobs:
  # ── Job 1: Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt ruff

      - name: Lint with ruff
        run: ruff check backend/ --select E,F,W --ignore E501

  # ── Job 2: Unit tests ─────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # pyzbar loads libzbar via ctypes at import time — without it, just
      # collecting the test files (which import main.py) fails immediately.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libzbar0

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v

  # ── Job 3: Build, push, deploy to STAGING (main branch only) ─────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Two quick pushes to main would otherwise race on the values-staging.yaml
    # bump below (both jobs read the file, both try to commit+push — the
    # second one's `git push` can fail on a non-fast-forward, or worse,
    # overwrite the first one's tag with a stale one depending on timing).
    # cancel-in-progress: false queues the second run instead of racing or
    # killing a deploy mid-flight.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: write   # needed to push image-tag commit back to repo
      id-token: write   # needed for OIDC auth (alternative to static keys)

    steps:
      # Uses a personal token (repo owner), not the default GITHUB_TOKEN — main
      # is a protected branch requiring a PR, and GitHub doesn't support bypass
      # actors (apps/teams) on personal (non-org) repos. The repo owner's own
      # token is exempt from that rule (enforce_admins: false on the branch
      # protection config), so this is what lets the automated image-tag-bump
      # commit below actually land on main.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # No :latest tag — meaningless in a GitOps setup that always pins by
      # commit SHA (values-staging.yaml never reads it, nothing does), and it
      # was just a second push of the same layers for nothing.
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/fastiride-dev-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/fastiride-dev-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Scans the actual images that just got pushed, not just the repo
      # filesystem (iac-quality.yaml's Trivy scan only ever saw requirements.txt
      # on disk — never the base image layers, e.g. python:3.12-slim's own CVEs).
      # Informational only for now (exit-code 0) — this is the first run ever
      # against these images, and gating the pipeline on unknown findings
      # before seeing what's actually there would just block every deploy.
      # Tighten to blocking on CRITICAL once a baseline is confirmed clean.
      - name: Trivy — scan built backend image (informational)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ecr.outputs.registry }}/fastiride-dev-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      - name: Trivy — scan built frontend image (informational)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ecr.outputs.registry }}/fastiride-dev-frontend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      - name: Install yq
        uses: mikefarah/yq@v4

      # GitOps: only values-staging.yaml gets bumped here — production's tag
      # only moves via promote-to-production.yaml, on an explicit version tag.
      - name: Update staging image tags (GitOps trigger)
        env:
          TAG: ${{ github.sha }}
        run: |
          cd helm/fastiride
          yq -i ".backend.image.tag = \"$TAG\"" values-staging.yaml
          yq -i ".frontend.image.tag = \"$TAG\"" values-staging.yaml
          git config user.email "ci@fastiride.app"
          git config user.name  "FastiRide CI"
          git add values-staging.yaml
          git diff --staged --quiet || \
            git commit -m "Deploy $TAG to staging [skip ci]"
          git push

      # No kubectl/argocd CLI here on purpose — the EKS public API endpoint is
      # locked to Lidor's own IP only (see terraform/dev.tfvars,
      # eks_public_access_cidrs), and a GitHub-hosted runner's IP isn't on that
      # list. This only proves staging answers over the public ALB after the
      # deploy trigger — it can't confirm the specific new image is live
      # (no cluster access to check), but it does catch a build that's up but
      # crash-looping/misconfigured, which is the failure mode that matters
      # most here.
      - name: Smoke test — wait for staging to come back healthy
        run: |
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null https://staging.fastiride.app/api/health; then
              echo "staging healthy after ${i}0s"
              exit 0
            fi
            echo "not healthy yet, retrying in 10s ($i/20)"
            sleep 10
          done
          echo "staging did not become healthy within 200s — failing the deploy"
          exit 1
