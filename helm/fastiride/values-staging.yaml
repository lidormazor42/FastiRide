# Staging: continuously deployed on every merge to main (see .github/workflows/ci.yaml,
# the "deploy-staging" job). Lighter footprint than prod — 1 replica each, this is
# where changes get validated before an explicit version-tag promotes them to prod.
backend:
  image:
    tag: b4e34021a2e95b4f0a4e3e41d6fdb2c3e1a7d1ff # seed value — bumped by CI (deploy-staging job) on every push to main from here on
  replicas: 1
  irsa:
    roleArn: "arn:aws:iam::439594592108:role/fastiride-dev-backend-irsa" # same role, trust policy allows both namespaces
frontend:
  image:
    tag: b4e34021a2e95b4f0a4e3e41d6fdb2c3e1a7d1ff # seed value — bumped by CI (deploy-staging job) on every push to main from here on
  replicas: 1
ingress:
  host: staging.fastiride.app
config:
  googleRedirectUri: https://staging.fastiride.app/api/auth/google/callback
hpa:
  enabled: false
