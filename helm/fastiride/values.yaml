# Default values — override with values-dev.yaml or values-prod.yaml
# ci-test: verifying OIDC pipeline

backend:
  image:
    repository: 439594592108.dkr.ecr.us-east-1.amazonaws.com/fastiride-dev-backend
    tag: baf9a2a5693f04b5cbda2d0c38b18ee30f3c52e3
    pullPolicy: Always
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  irsa:
    roleArn: "" # set in values-dev/prod.yaml after terraform apply
frontend:
  image:
    repository: 439594592108.dkr.ecr.us-east-1.amazonaws.com/fastiride-dev-frontend
    tag: baf9a2a5693f04b5cbda2d0c38b18ee30f3c52e3
    pullPolicy: Always
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
ingress:
  host: fastiride.app
  tlsEnabled: true
config:
  googleRedirectUri: https://fastiride.app/api/auth/google/callback
  sesSenderEmail: noreply@fastiride.app
  awsRegion: us-east-1
  useRekognition: "true"
  # Bucket created by terraform module "uploads" — name is deterministic per env
  s3UploadsBucket: fastiride-dev-ticket-uploads
hpa:
  enabled: false
  backend:
    minReplicas: 2
    maxReplicas: 6
    cpuTarget: 70
  frontend:
    minReplicas: 2
    maxReplicas: 4
    cpuTarget: 70
