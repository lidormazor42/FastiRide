# Shared defaults — image tags and everything environment-specific (host,
# replicas, IRSA role) live in values-staging.yaml / values-prod.yaml instead.
# Staging's tag is bumped by CI on every merge to main; prod's tag is only
# bumped by the promote-to-production job, triggered by a version tag push.

backend:
  image:
    repository: 439594592108.dkr.ecr.us-east-1.amazonaws.com/fastiride-dev-backend
    pullPolicy: Always
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  irsa:
    roleArn: "" # set in values-staging/prod.yaml after terraform apply
frontend:
  image:
    repository: 439594592108.dkr.ecr.us-east-1.amazonaws.com/fastiride-dev-frontend
    pullPolicy: Always
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
ingress:
  tlsEnabled: true
config:
  # In-namespace Redis service (redis-deployment.yaml) — the chat pub/sub bus
  redisUrl: redis://redis:6379/0
  sesSenderEmail: noreply@fastiride.app
  awsRegion: us-east-1
  useRekognition: "true"
  # Bucket created by terraform module "uploads" — name is deterministic per env
  s3UploadsBucket: fastiride-dev-ticket-uploads
hpa:
  enabled: false
  backend:
    minReplicas: 2
    maxReplicas: 6
    cpuTarget: 70
  frontend:
    minReplicas: 2
    maxReplicas: 4
    cpuTarget: 70
networkPolicy:
  enabled: false # flip per-environment in values-staging/prod.yaml — verify on staging before prod, same rollout pattern as hpa.enabled
  publicSubnetCidrs: ["10.0.1.0/24", "10.0.2.0/24"] # ALB (target-type "ip") lives here — must stay in sync with terraform/dev.tfvars
