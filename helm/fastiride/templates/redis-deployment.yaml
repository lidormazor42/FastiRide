# Chat pub/sub bus — pure ephemeral transport (messages persist in Postgres
# via ChatMessage), so: no PVC, single replica, tiny resources. Deployed
# per-namespace so staging and prod chat channels can never bleed into each
# other. Deliberately NOT ElastiCache: a managed billed service buys nothing
# for data that is inherently re-derivable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fastiride.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # redis:7-alpine's own user is uid 999 / gid 1000. fsGroup makes the
      # /data emptyDir writable by that user (same class of issue found and
      # fixed for the frontend's nginx cache dir).
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: redis
          image: redis:7-alpine
          # No persistence by design (see the module-level comment) — disables
          # RDB/AOF explicitly instead of relying on "no PVC" alone, so a
          # read-only root filesystem never even attempts a background save.
          command: ["redis-server", "--save", "", "--appendonly", "no"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          emptyDir: {}
