apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fastiride.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      # appuser in the Dockerfile is uid/gid 1000 (first useradd on Debian slim).
      # fsGroup so the /tmp emptyDir is actually writable by that user — see
      # the identical issue (and fix) found for the frontend's nginx cache dir.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Runs `alembic upgrade head` to completion before the app container
      # starts — same image, same DB creds, so schema is always migrated
      # before any replica can serve traffic. A rollout with N replicas still
      # only runs this once per new Pod, and alembic_version makes re-runs on
      # an already-migrated DB a no-op, so this is also safe on every restart.
      initContainers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fastiride-secrets
                  key: database-url
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fastiride-secrets
                  key: database-url
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: fastiride-secrets
                  key: session-secret
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: fastiride-secrets
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fastiride-secrets
                  key: google-client-secret
            - name: GOOGLE_REDIRECT_URI
              value: {{ .Values.config.googleRedirectUri | quote }}
            - name: REDIS_URL
              value: {{ .Values.config.redisUrl | quote }}
            - name: SES_SENDER_EMAIL
              value: {{ .Values.config.sesSenderEmail | quote }}
            - name: AWS_REGION
              value: {{ .Values.config.awsRegion | quote }}
            - name: USE_REKOGNITION
              value: {{ .Values.config.useRekognition | quote }}
            {{- if .Values.config.s3UploadsBucket }}
            - name: S3_UPLOADS_BUCKET
              value: {{ .Values.config.s3UploadsBucket | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          # Readiness checks the DB (pull from endpoints on failure); liveness
          # stays shallow (restart only if the process itself is dead) — see
          # the /api/ready vs /api/health docstrings in main.py.
          readinessProbe:
            httpGet: { path: /api/ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
