backend:
  image:
    tag: 6b487f27458cc00641504f10fe860bb5c9a556da # seed value — bumped ONLY by CI's promote-to-production job from here on (on a version-tag push, not every merge)
  replicas: 1 # chat rooms live in-process memory — 2 replicas would split delivery across pods
  irsa:
    roleArn: "arn:aws:iam::439594592108:role/fastiride-dev-backend-irsa"
frontend:
  image:
    tag: 6b487f27458cc00641504f10fe860bb5c9a556da # seed value — bumped ONLY by CI's promote-to-production job from here on (on a version-tag push, not every merge)
  replicas: 2 # stateless (nginx serving static files) — safe to run >1, unlike backend
ingress:
  host: fastiride.app
config:
  googleRedirectUri: https://fastiride.app/api/auth/google/callback
hpa:
  enabled: false
