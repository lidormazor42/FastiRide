backend:
  image:
    tag: e345f91fa4fd91011d13294049088536e5e9b191 # seed value — bumped ONLY by CI's promote-to-production job from here on (on a version-tag push, not every merge)
  replicas: 2 # chat now rides Redis pub/sub (cross-pod delivery verified on staging) — the old 1-replica pin is gone
  irsa:
    roleArn: "arn:aws:iam::439594592108:role/fastiride-dev-backend-irsa"
frontend:
  image:
    tag: e345f91fa4fd91011d13294049088536e5e9b191 # seed value — bumped ONLY by CI's promote-to-production job from here on (on a version-tag push, not every merge)
  replicas: 2 # stateless (nginx serving static files) — safe to run >1, unlike backend
ingress:
  host: fastiride.app
config:
  googleRedirectUri: https://fastiride.app/api/auth/google/callback
hpa:
  enabled: true # verified live on staging: 2->6 backend replicas under load (CPU 217%/70%), then scaled back down after
networkPolicy:
  enabled: true # verified live on staging: ALB routing intact, Prometheus scrape allowed, unrelated namespace + unlabeled same-namespace pod both genuinely blocked (000/timeout, not a no-op)
