# Loki (log aggregation) — deployed via ArgoCD (see k8s/argocd/app-monitoring-loki.yaml).

loki:
  enabled: true
  persistence:
    enabled: true
    storageClassName: gp2
    size: 10Gi
  config:
    limits_config:
      retention_period: 168h   # 7 days

# Promtail — runs as DaemonSet, scrapes pod logs and ships to Loki
promtail:
  enabled: true
  config:
    clients:
      # Service name is derived from the ArgoCD Application/Helm release name
      # (monitoring-loki), not "loki" — see k8s/argocd/app-monitoring-loki.yaml
      - url: http://monitoring-loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

grafana:
  enabled: false   # using standalone grafana deployment
