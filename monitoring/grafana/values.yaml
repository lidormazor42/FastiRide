# Grafana — deployed via ArgoCD (see k8s/argocd/app-monitoring-grafana.yaml), not manual helm.

# Password lives in a Kubernetes Secret created by bootstrap-prod.sh (same pattern as
# fastiride-secrets for the main app) — never committed to Git in plaintext.
admin:
  existingSecret: grafana-admin-credentials
  userKey: admin-user
  passwordKey: admin-password

persistence:
  enabled: true
  storageClassName: gp2
  size: 5Gi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        # Service name is derived from the ArgoCD Application/Helm release name
        # (monitoring-prometheus), not the chart name — see k8s/argocd/app-monitoring-prometheus.yaml
        url: http://monitoring-prometheus-kube-prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        type: loki
        url: http://monitoring-loki.monitoring.svc.cluster.local:3100

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        folder: FastiRide
        type: file
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    kubernetes-cluster:
      gnetId: 7249    # Kubernetes Cluster Overview (from grafana.com)
      revision: 1
      datasource: Prometheus
    fastapi-metrics:
      gnetId: 14927   # FastAPI Observability (community dashboard — some panels won't match our label names, kept for reference)
      revision: 1
      datasource: Prometheus
    fastiride-backend:
      datasource: Prometheus
      # Custom dashboard built for FastiRide's actual metric names (http_requests_total,
      # http_request_duration_seconds_*), following the RED method: Rate, Errors, Duration.
      json: |
        {
          "title": "FastiRide Backend",
          "uid": "fastiride-backend",
          "schemaVersion": 39,
          "version": 1,
          "editable": true,
          "timezone": "browser",
          "time": { "from": "now-1h", "to": "now" },
          "refresh": "30s",
          "tags": ["fastiride"],
          "panels": [
            {
              "id": 1,
              "title": "Total Requests",
              "type": "stat",
              "datasource": "Prometheus",
              "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
              "targets": [
                { "expr": "sum(http_requests_total{job=\"fastiride-backend\"})", "legendFormat": "requests" }
              ],
              "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }] } }, "overrides": [] }
            },
            {
              "id": 2,
              "title": "Error Rate (4xx/5xx)",
              "type": "stat",
              "datasource": "Prometheus",
              "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
              "targets": [
                { "expr": "100 * sum(rate(http_requests_total{job=\"fastiride-backend\", status=~\"4xx|5xx\"}[5m])) / sum(rate(http_requests_total{job=\"fastiride-backend\"}[5m]))", "legendFormat": "error %" }
              ],
              "fieldConfig": { "defaults": { "unit": "percent", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 }] } }, "overrides": [] }
            },
            {
              "id": 3,
              "title": "p95 Latency",
              "type": "stat",
              "datasource": "Prometheus",
              "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
              "targets": [
                { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"fastiride-backend\"}[5m])) by (le))", "legendFormat": "p95" }
              ],
              "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "red", "value": 2 }] } }, "overrides": [] }
            },
            {
              "id": 4,
              "title": "Request Rate (total)",
              "type": "stat",
              "datasource": "Prometheus",
              "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
              "targets": [
                { "expr": "sum(rate(http_requests_total{job=\"fastiride-backend\"}[5m]))", "legendFormat": "req/s" }
              ],
              "fieldConfig": { "defaults": { "unit": "reqps", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }] } }, "overrides": [] }
            },
            {
              "id": 5,
              "title": "Request Rate by Endpoint",
              "type": "timeseries",
              "datasource": "Prometheus",
              "gridPos": { "h": 9, "w": 12, "x": 0, "y": 5 },
              "targets": [
                { "expr": "sum(rate(http_requests_total{job=\"fastiride-backend\"}[5m])) by (handler)", "legendFormat": "{{handler}}" }
              ],
              "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
            },
            {
              "id": 6,
              "title": "p95 Latency by Endpoint",
              "type": "timeseries",
              "datasource": "Prometheus",
              "gridPos": { "h": 9, "w": 12, "x": 12, "y": 5 },
              "targets": [
                { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"fastiride-backend\"}[5m])) by (le, handler))", "legendFormat": "{{handler}}" }
              ],
              "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
            },
            {
              "id": 7,
              "title": "Requests by Status Code",
              "type": "timeseries",
              "datasource": "Prometheus",
              "gridPos": { "h": 9, "w": 24, "x": 0, "y": 14 },
              "targets": [
                { "expr": "sum(rate(http_requests_total{job=\"fastiride-backend\"}[5m])) by (status)", "legendFormat": "{{status}}" }
              ],
              "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
            }
          ]
        }

service:
  type: ClusterIP   # public access is via the Ingress below, not this service directly

# Shares the SAME ALB as the main app (group.name annotation) instead of provisioning
# a second load balancer — AWS Load Balancer Controller merges any Ingress with a
# matching group.name onto one ALB.
ingress:
  enabled: true
  ingressClassName: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:439594592108:certificate/c2fd86e1-e512-4d2f-8ec2-8f1d175f1cdd"
    alb.ingress.kubernetes.io/group.name: "fastiride-shared"
  hosts:
    - grafana.fastiride.app
  path: /
  pathType: Prefix
