# kube-prometheus-stack — deployed via ArgoCD (see k8s/argocd/app-monitoring-prometheus.yaml).

grafana:
  enabled: false   # deployed separately (see monitoring/grafana/values.yaml)
  adminPassword: CHANGE_ME

prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          resources:
            requests:
              storage: 20Gi
    # Scrape FastiRide backend metrics — namespace is fastiride-prod, not fastiride
    # (see project_roadmap memory: the app namespace was renamed 2026-07-05)
    additionalScrapeConfigs:
      - job_name: fastiride-backend
        static_configs:
          - targets: ["backend.fastiride-prod.svc.cluster.local:8000"]

# Disabled — nothing is configured to receive alerts (no Slack/PagerDuty), and it was
# using up a pod slot on a node already at its 17-pod capacity limit. Re-enable + configure
# a real receiver (route.receiver) if/when actual alerting is needed.
alertmanager:
  enabled: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
