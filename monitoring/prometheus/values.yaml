# kube-prometheus-stack — deployed via ArgoCD (see k8s/argocd/app-monitoring-prometheus.yaml).

grafana:
  enabled: false   # deployed separately (see monitoring/grafana/values.yaml)
  adminPassword: CHANGE_ME

# EKS is a managed control plane — AWS doesn't expose the scheduler, controller-manager,
# or etcd for scraping (they're not customer-visible at all, by design). Without this,
# the chart's default alert rules fire KubeSchedulerDown/KubeControllerManagerDown/
# KubeEtcdDown forever — real-looking alerts about something that was never reachable
# in the first place, not an actual outage.
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          resources:
            requests:
              storage: 20Gi
    # Scrape FastiRide backend metrics — namespace is fastiride-prod, not fastiride
    # (see project_roadmap memory: the app namespace was renamed 2026-07-05)
    additionalScrapeConfigs:
      - job_name: fastiride-backend
        static_configs:
          - targets: ["backend.fastiride-prod.svc.cluster.local:8000"]

# Re-enabled with a real email receiver via SES SMTP (terraform/ses-alerting.tf).
# NOTE: this adds back the pod slot we freed earlier — check node pod counts
# (`kubectl describe nodes`) after this deploys; may need the VPC CNI prefix-delegation
# fix if a node is at its 17-pod cap again.
alertmanager:
  enabled: true
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/alertmanager-ses-smtp/ — created by
    # bootstrap-prod.sh from .env, same pattern as fastiride-secrets / grafana-admin-credentials.
    secrets:
      - alertmanager-ses-smtp
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: "email-smtp.us-east-1.amazonaws.com:587"
      smtp_from: "lidormazor42@gmail.com"
      # This is the IAM Access Key ID (an identifier, not the secret itself — the actual
      # secret is the derived SMTP password below, which IS file-mounted from a Secret).
      # Fill in with the `alertmanager_ses_smtp_username` terraform output after apply.
      smtp_auth_username: "AKIAWMWPBE5WFMMYU4GX"
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-ses-smtp/smtp-password
      smtp_require_tls: true
    route:
      receiver: "email-alerts"
      group_by: ["alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      # The chart's default config always includes this child route (Helm deep-merges
      # dicts, so it survives even though we're overriding `route` above) — it silences
      # "Watchdog", a constant heartbeat alert kube-prometheus-stack fires on purpose to
      # prove Alertmanager itself is alive. Without a matching receiver named "null" it
      # errors out and the whole Alertmanager pod never starts.
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "email-alerts"
        email_configs:
          - to: "lidormazor42@gmail.com"
            send_resolved: true
      - name: "null"

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
