version: "3.9"

services:

  db:
    image: postgres:16-alpine
    container_name: fastiride-db
    environment:
      POSTGRES_USER: fastiride
      POSTGRES_PASSWORD: fastiride
      POSTGRES_DB: fastiride
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fastiride-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastiride"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fastiride-redis
    networks:
      - fastiride-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: fastiride-backend
    env_file:
      - .env
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://fastiride:fastiride@db:5432/fastiride
      - REDIS_URL=redis://redis:6379/0
      - AWS_REGION=us-east-1
      - USE_REKOGNITION=true
      # S3_UPLOADS_BUCKET is set once terraform creates the bucket:
      # - S3_UPLOADS_BUCKET=fastiride-dev-ticket-uploads
    volumes:
      # Local dev only — lets boto3 use your host AWS credentials for
      # Rekognition. In EKS this is replaced by IRSA (no keys at all).
      - ~/.aws:/root/.aws:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fastiride-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: fastiride-frontend
    ports:
      - "80:8080" # nginx listens on 8080 inside the container (unprivileged port, see nginx.conf)
    volumes:
      - ./frontend/html:/usr/share/nginx/html
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fastiride-net

networks:
  fastiride-net:
    driver: bridge

volumes:
  postgres_data:
