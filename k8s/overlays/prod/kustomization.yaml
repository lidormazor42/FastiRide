apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fastiride

bases:
  - ../../base

images:
  - name: backend-image
    newName: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/fastiride-prod-backend
    newTag: latest
  - name: frontend-image
    newName: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/fastiride-prod-frontend
    newTag: latest

resources:
  - hpa.yaml

patches:
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: fastiride.example.com
    target:
      kind: Ingress
      name: fastiride
  - patch: |-
      - op: replace
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
        value: REPLACE_WITH_BACKEND_IRSA_ROLE_ARN
    target:
      kind: ServiceAccount
      name: backend

configMapGenerator:
  - name: fastiride-config
    literals:
      - google-redirect-uri=https://fastiride.example.com/api/auth/google/callback
      - ses-sender-email=noreply@fastiride.example.com

secretGenerator:
  - name: fastiride-secrets
    literals:
      - database-url=postgresql://fastiride:CHANGE_ME@postgres:5432/fastiride
      - session-secret=CHANGE_ME_32_CHAR_RANDOM_STRING
      - google-client-id=CHANGE_ME
      - google-client-secret=CHANGE_ME
      - postgres-password=CHANGE_ME
