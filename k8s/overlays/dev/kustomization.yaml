apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fastiride

bases:
  - ../../base

# CI pipeline updates these image tags on every merge to main
images:
  - name: backend-image
    newName: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/fastiride-dev-backend
    newTag: latest
  - name: frontend-image
    newName: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/fastiride-dev-frontend
    newTag: latest

patches:
  # 1 replica is enough for dev — saves money
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: backend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: frontend
  # Point Ingress to the dev hostname
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.fastiride.example.com
    target:
      kind: Ingress
      name: fastiride
  # Patch IRSA annotation — fill ARN from: terraform output backend_irsa_role_arn
  - patch: |-
      - op: replace
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
        value: REPLACE_WITH_BACKEND_IRSA_ROLE_ARN
    target:
      kind: ServiceAccount
      name: backend

configMapGenerator:
  - name: fastiride-config
    literals:
      - google-redirect-uri=https://dev.fastiride.example.com/api/auth/google/callback
      - ses-sender-email=noreply@fastiride.example.com

secretGenerator:
  - name: fastiride-secrets
    literals:
      - database-url=postgresql://fastiride:CHANGE_ME@postgres:5432/fastiride
      - session-secret=CHANGE_ME_32_CHAR_RANDOM_STRING
      - google-client-id=CHANGE_ME
      - google-client-secret=CHANGE_ME
      - postgres-password=CHANGE_ME
