apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastiride-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/lidormazor42/FastiRide
    targetRevision: main   # prod tracks only the stable main branch
    path: helm/fastiride
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: fastiride-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
