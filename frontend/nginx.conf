# WebSocket support: forward the client's Upgrade header as-is, and set
# Connection to "upgrade" only when an upgrade was actually requested.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Serve the party-vibes marketing landing page directly from Nginx.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # Serve the role-selection / login / ticket-upload app flow (formerly at /).
    location = /app {
        try_files /app.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # Serve the ride board page directly from Nginx.
    location = /board {
        try_files /board.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # Reverse-proxy all API calls to the FastAPI backend.
    # The trailing slash on proxy_pass strips the /api prefix before forwarding.
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket upgrade (chat) — without these the handshake dies here
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
