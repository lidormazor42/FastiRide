server {
    listen 80;
    root /usr/share/nginx/html;

    # Serve the landing page directly from Nginx — no backend involved.
    location = / {
        try_files /index.html =404;
    }

    # Serve the ride board page directly from Nginx.
    location = /board {
        try_files /board.html =404;
    }

    # Reverse-proxy all API calls to the FastAPI backend.
    # The trailing slash on proxy_pass strips the /api prefix before forwarding.
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
